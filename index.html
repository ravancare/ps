سب❤️", "en": "Mashallah, I love this cream and it is good on the skin. Most important, you do not need powder or concealer or anything on top 😍😍❤️ It is perfect for girls who do not like wearing makeup but still want something that helps their skin and looks lovely. Your cream is a great fit ❤️"}}, {"n": {"ar": "رهف", "en": "Rahaf"}, "t": {"ar": "يعطيك الف عافية يارب اللمنتج ولا غلطة صراحة وكثير خفيف وجد بيعطي منظر مثل الفاونديشن صرت احطه بس هو على وجهي واطلع يسلم ايديكي", "en": "Thank you so much, the product is flawless honestly. It is very light and gives a foundation look. I now wear it on its own on my face and head out. Bless your hands."}}], "faq": [{"q": {"ar": "هل هو واقي شمس ولا فاونديشن؟", "en": "Is it a sunscreen or a foundation?"}, "a": {"ar": "الاثنين مع ترطيب. حسب العبوة هو 3 في 1: حماية UVA وUVB وترطيب وتأثير فاونديشن.", "en": "Both, plus hydration. Per the packaging it is 3 in 1: UVA and UVB protection, hydration and a foundation effect."}}, {"q": {"ar": "شو عامل الحماية؟", "en": "What is the protection level?"}, "a": {"ar": "SPF 50+ وPA++++ مكتوبين على العبوة.", "en": "SPF 50+ and PA++++, as printed on the packaging."}}, {"q": {"ar": "كم حجم الأنبوب؟", "en": "What size is the tube?"}, "a": {"ar": "50 مل (1.69 أونصة).", "en": "50 ml (1.69 fl oz)."}}, {"q": {"ar": "كيف بطلب؟", "en": "How do I order?"}, "a": {"ar": "عبّي النموذج بالأسفل واضغطي إرسال. بنفتحلك واتساب برسالة جاهزة وبنأكد معك الطلب.", "en": "Fill in the form below and press send. We open WhatsApp with a ready message and confirm your order."}}, {"q": {"ar": "كم سعر التوصيل؟", "en": "How much is delivery?"}, "a": {"ar": "بيختلف حسب المنطقة وبيظهر بملخص الطلب قبل ما تبعتي.", "en": "It depends on your region and shows in the order summary before you send."}}, {"q": {"ar": "لازم أعيد وضع الواقي خلال اليوم؟", "en": "Should I reapply during the day?"}, "a": {"ar": "عادة بتنصح الجهات الصحية بإعادة وضع واقي الشمس كل ساعتين تقريبا لما تكوني برا. اتبعي التعليمات المكتوبة على العبوة.", "en": "Health bodies generally advise reapplying sunscreen about every two hours when outdoors. Follow the directions on the packaging."}}], "t": {"ar": {"pE": "المنتج", "pH": "Güneş Altını\nTinted Sunscreen Foundation"}}}</script>

function fxOff(el){el.classList.remove('fx','fxt');el.style.removeProperty('--rx');el.style.removeProperty('--ry')}

  fxE=e;if(!fxT)fxT=requestAnimationFrame(fxRun)},{passive:true});
